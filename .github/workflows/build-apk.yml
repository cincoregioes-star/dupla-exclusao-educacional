name: Build APK Dupla Exclusao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'style.css'
      - 'tablet-v24.css'
      - 'app.js'
      - 'config.js'
      - 'auth-institucional.js'
      - 'dashboard-institucional.js'
      - 'institutional-controls.js'
      - 'tablet-v24.js'
      - 'survey-v24.js'
      - 'bullying-v24.js'
      - 'question-bank.js'
      - 'album-data-v24.js'
      - 'manifest.webmanifest'
      - 'logo-pedro-queiroz.jpg'
      - '*.webp'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Montar projeto web exclusivo do APK
        shell: bash
        run: |
          set -e
          mkdir -p mobile/www/figurinhas mobile/www/icons

          # O site público usa o index.html antigo. O APK usa sua própria interface.
          cp apk/index.html mobile/www/index.html
          cp style.css tablet-v24.css app.js config.js auth-institucional.js dashboard-institucional.js institutional-controls.js tablet-v24.js survey-v24.js bullying-v24.js question-bank.js album-data-v24.js manifest.webmanifest mobile/www/
          cp apk/service-worker.js mobile/www/service-worker.js
          cp logo-pedro-queiroz.jpg mobile/www/

          if [ -f qrcode_album_dupla_exclusao.png ]; then cp qrcode_album_dupla_exclusao.png mobile/www/; fi
          if [ -f qrcode-album-dupla-exclusao.png ]; then cp qrcode-album-dupla-exclusao.png mobile/www/; fi

          # Opção 2: ícone exclusivo do APK. Não altera o favicon/logo do site público.
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 apk/icon-option2.svg -o /tmp/icon-option2-192.png
          rsvg-convert -w 512 -h 512 apk/icon-option2.svg -o /tmp/icon-option2-512.png
          cp /tmp/icon-option2-192.png mobile/www/icon-192.png
          cp /tmp/icon-option2-512.png mobile/www/icon-512.png
          cp /tmp/icon-option2-192.png mobile/www/icons/icon-192.png
          cp /tmp/icon-option2-512.png mobile/www/icons/icon-512.png
          cp apk/platform-link.js mobile/www/apk-platform-link.js
          sed -i 's#</body>#<script src="apk-platform-link.js"></script></body>#' mobile/www/index.html

          for i in $(seq -w 1 36); do
            cp "$i.webp" "mobile/www/$i.webp"
            cp "$i.webp" "mobile/www/figurinhas/$i.webp"
          done

          git clone --depth 1 https://github.com/cincoregioes-star/album-dupla-exclusao-premium.git /tmp/dupla-premium
          cp -R /tmp/dupla-premium/game mobile/www/game

      - name: Criar configuracao Capacitor
        shell: bash
        run: |
          cat > mobile/package.json <<'JSON'
          {
            "name": "dupla-exclusao-educacional",
            "version": "1.0.0",
            "private": true,
            "dependencies": {"@capacitor/core": "7.4.3"},
            "devDependencies": {"@capacitor/cli": "7.4.3","@capacitor/android": "7.4.3"}
          }
          JSON

          cat > mobile/capacitor.config.json <<'JSON'
          {
            "appId": "br.com.pedrodequeiroz.duplaexclusao",
            "appName": "Dupla Exclusão",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {"androidScheme": "https"}
          }
          JSON

      - name: Instalar Capacitor
        working-directory: mobile
        run: npm install

      - name: Criar projeto Android
        working-directory: mobile
        run: npx cap add android

      - name: Aplicar logotipo opção 2 ao Android
        shell: bash
        run: |
          set -e
          rm -f mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml

          for d in \
            mobile/android/app/src/main/res/mipmap-mdpi \
            mobile/android/app/src/main/res/mipmap-hdpi \
            mobile/android/app/src/main/res/mipmap-xhdpi \
            mobile/android/app/src/main/res/mipmap-xxhdpi \
            mobile/android/app/src/main/res/mipmap-xxxhdpi; do
            [ -d "$d" ] || continue
            rm -f "$d"/ic_launcher.webp "$d"/ic_launcher_round.webp "$d"/ic_launcher_foreground.webp
            cp /tmp/icon-option2-512.png "$d"/ic_launcher.png
            cp /tmp/icon-option2-512.png "$d"/ic_launcher_round.png
          done

      - name: Sincronizar arquivos web
        working-directory: mobile
        run: npx cap sync android

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gerar APK de teste
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Dupla-Exclusao-Educacional.apk
          ls -lh Dupla-Exclusao-Educacional.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Dupla-Exclusao-Educacional-APK
          path: Dupla-Exclusao-Educacional.apk
          retention-days: 30
