name: Integrar autenticacao institucional

on:
  push:
    branches: [main]
    paths:
      - 'auth-institucional.js'
      - '.github/workflows/integrate-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Integrar script de autenticacao no index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="auth-institucional.js"></script>'
          if tag not in s:
              anchor = '<script src="dashboard-institucional.js"></script>'
              if anchor in s:
                  s = s.replace(anchor, tag + '\n' + anchor)
              else:
                  s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar se houver alteracao
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integra login institucional na interface"
          git push
